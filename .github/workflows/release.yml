name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v5

      - name: Check tag matches versionName
        run: |
          version_name=$(grep '^memorygate.versionName=' gradle.properties | cut -d= -f2)
          if [ "${GITHUB_REF_NAME}" != "v${version_name}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version_name} in gradle.properties"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "${GITHUB_ENV}"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature and rename APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "${apk}" ]; then
            echo "::error::Signed APK not found (is signing configured?)"
            ls -R app/build/outputs/apk/release || true
            exit 1
          fi
          "${ANDROID_HOME}"/build-tools/*/apksigner verify --print-certs "${apk}" | head -n 5
          cp "${apk}" "memory-gate-${GITHUB_REF_NAME}.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "memory-gate-${GITHUB_REF_NAME}.apk" \
            --title "Memory Gate ${GITHUB_REF_NAME}" \
            --generate-notes
